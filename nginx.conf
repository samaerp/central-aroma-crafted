server {
  listen 80;
  server_name _;

  # TARUH root di sini (bukan di dalam location)
  root   /usr/share/nginx/html;
  index  index.html;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Healthcheck
  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml+rss application/xml text/javascript image/svg+xml;
  gzip_min_length 1024;

  # Cache immutable assets (inherit root dari server)
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Jangan cache index.html
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
