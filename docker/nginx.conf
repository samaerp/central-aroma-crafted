server {
  listen 80;
  server_name _;

  # Security headers (safe defaults for SPA)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  # Note: Do NOT set a strict CSP here unless you audit your app's inline scripts

  # Healthcheck
  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }

  # Gzip for text assets
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml+rss application/xml text/javascript image/svg+xml;
  gzip_min_length 1024;

  # Cache immutable hashed assets aggressively
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Never cache index.html (so deploys go live immediately)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
    root   /usr/share/nginx/html;
    index  index.html;
  }
}
